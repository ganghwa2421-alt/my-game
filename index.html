<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유튜버 키우기</title>
    <style>
        /* 모든 CSS 디자인을 여기에 합쳤습니다 */
        body {
            background-color: #f0f2f5;
            color: #333333;
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            width: 100%;
            max-width: 500px;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .stats-panel {
            background-color: #f8faac;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .stat-item {
            font-size: 16px;
            margin: 8px 0;
            font-weight: bold;
        }
        .news-zone {
            background-color: #1a202c;
            color: #48bb78;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            min-height: 20px;
        }
        .action-card {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .progress-bar-bg {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 4px;
            height: 12px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: #ed64a6;
            transition: width 0.1s linear;
        }
        .game-btn {
            background-color: #4299e1;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .game-btn:hover { background-color: #3182ce; }
        .game-btn:disabled { background-color: #cbd5e0; cursor: not-allowed; }
        .modal-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 400px;
            width: 85%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h2>🎬 유튜버 키우기 타이쿤</h2>
        <div>LIVE BROADCAST 😐</div>
    </div>

    <div class="stats-panel">
        <div class="stat-item">📅 진행 날짜: <span id="view-date">1</span>일 차</div>
        <div class="stat-item">❤️ 구독자 수: <span id="view-subs">0</span>명</div>
        <div class="stat-item">📈 누적 조회수: <span id="view-views">0</span>회</div>
        <div class="stat-item">💰 보유 자금: <span id="view-gold">0</span>원</div>
    </div>

    <div class="news-zone">
        <div id="view-news">최근 소식: 유튜버 지망생, 새로운 채널 개설!</div>
    </div>

    <div class="action-card">
        <button id="btn-shoot" class="game-btn">🎥 영상 촬영하기</button>
        <div class="progress-bar-bg">
            <div id="fill-shoot" class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="action-card">
        <button id="btn-edit" class="game-btn" disabled>💻 영상 편집하기 (촬영본 필요)</button>
        <div class="progress-bar-bg">
            <div id="fill-edit" class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="action-card">
        <button id="btn-upload" class="game-btn" disabled>📤 유튜브 업로드 (편집본 필요)</button>
        <div class="progress-bar-bg">
            <div id="fill-upload" class="progress-bar-fill"></div>
        </div>
    </div>
</div>

<div id="start-modal" class="modal-layer">
    <div class="modal-box">
        <h3>📢 채널 개설 완료!</h3>
        <p>오늘부터 1일 차 유튜버로서의 대여정이 시작됩니다. 먼저 영상을 촬영해 보세요!</p>
        <button class="game-btn" onclick="closeStartModal()">시작하기</button>
    </div>
</div>

<script>
/* 모든 자바스크립트 기능을 여기에 합쳤습니다 */
let gold = 0;
let subs = 0;
let views = 0;
let date = 1;
let shootStack = 0;
let editStack = 0;
let isWorking = false;

function closeStartModal() {
    document.getElementById("start-modal").classList.add("hidden");
}

document.getElementById("btn-shoot").onclick = () => {
    if(isWorking) return;
    isWorking = true;
    let pct = 0;
    const fill = document.getElementById("fill-shoot");
    const timer = setInterval(() => {
        pct += 5;
        fill.style.width = pct + "%";
        if(pct >= 100) {
            clearInterval(timer);
            fill.style.width = "0%";
            shootStack++;
            isWorking = false;
            document.getElementById("view-news").innerText = `📰 촬영 완료! (보유 촬영본: ${shootStack}개)`;
            checkButtons();
        }
    }, 100);
};

document.getElementById("btn-edit").onclick = () => {
    if(isWorking || shootStack <= 0) return;
    shootStack--;
    isWorking = true;
    let pct = 0;
    const fill = document.getElementById("fill-edit");
    const timer = setInterval(() => {
        pct += 5;
        fill.style.width = pct + "%";
        if(pct >= 100) {
            clearInterval(timer);
            fill.style.width = "0%";
            editStack++;
            isWorking = false;
            document.getElementById("view-news").innerText = `📰 편집 완료! (보유 편집본: ${editStack}개)`;
            checkButtons();
        }
    }, 100);
};

document.getElementById("btn-upload").onclick = () => {
    if(isWorking || editStack <= 0) return;
    editStack--;
    isWorking = true;
    let pct = 0;
    const fill = document.getElementById("fill-upload");
    const timer = setInterval(() => {
        pct += 5;
        fill.style.width = pct + "%";
        if(pct >= 100) {
            clearInterval(timer);
            fill.style.width = "0%";
            
            let newViews = Math.floor(Math.random() * 80) + 20;
            let newSubs = Math.floor(newViews * 0.1) + 1;
            let newGold = newViews * 2;
            
            views += newViews;
            subs += newSubs;
            gold += newGold;
            date += Math.floor(Math.random() * 2) + 1;
            
            isWorking = false;
            
            document.getElementById("view-date").innerText = date;
            document.getElementById("view-subs").innerText = subs;
            document.getElementById("view-views").innerText = views;
            document.getElementById("view-gold").innerText = gold;
            
            document.getElementById("view-news").innerText = `🎉 업로드 성공! 조회수 +${newViews}회 / 구독자 +${newSubs}명 / 수익 +${newGold}원`;
            checkButtons();
        }
    }, 100);
};

function checkButtons() {
    document.getElementById("btn-edit").disabled = (shootStack <= 0 || isWorking);
    document.getElementById("btn-upload").disabled = (editStack <= 0 || isWorking);
    document.getElementById("btn-shoot").disabled = isWorking;
}
</script>
</body>
</html>
